<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hemendra's Portfolio</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="icon" type="image/png" href="assets/programmer.png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .nav-link.active {
            color: var(--primary-color);
        }

        .nav-link.active::after {
            width: 100%;
        }

        .nav-cta {
            margin-left: 1rem;
        }
    </style>
</head>

<!-- Body -->

<body>
    <!-- Header Start -->
    <!-- Navbar Start -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2><span class="highlight">Hemendra's</span></h2>
            </div>
            <div class="nav-menu">
                <a href="index.html#home" class="nav-link">Home</a>
                <a href="index.html#about" class="nav-link">About</a>
                <a href="index.html#skills" class="nav-link">Skills</a>
                <a href="index.html#projects" class="nav-link">Projects</a>
                <a href="index.html#experience" class="nav-link">Experience</a>
                <!-- <a href="gallery.html" class="nav-link">Gallery</a> -->
                <a href="index.html#contact" class="nav-link">Contact</a>
            </div>

            <div class="nav-toggle">
                <a href="index.html#contact" class="btn btn-outline nav-cta">
                    <i class="fas fa-handshake"></i> Hire Me
                </a>
                <button class="theme-toggle" id="theme-toggle">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="hamburger" id="hamburger">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </nav>
    <!-- Navbar Close -->
    <!-- Header  END -->

    <!-- Main Section -->
    <main>
        <div id="home"></div>
        <div id="about"></div>
        <div id="skills"></div>
        <div id="projects"></div>
        <div id="experience"></div>
        <div id="education"></div>
        <div id="contact"></div>
    </main>
    <!-- Main Section end -->

    <!-- Footer Section -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-text">
                    <p>&copy; 2026 Nirlipt Technologies All rights reserved.</p>
                </div>
                <div class="footer-links">
                    <a href="index.html#home"><i class="fas fa-home"></i> Home</a>
                    <a href="index.html#projects"><i class="fas fa-code"></i> Projects</a>
                    <a href="index.html#contact"><i class="fas fa-envelope"></i> Contact</a>
                </div>
            </div>
        </div>
    </footer>
    <!-- Footer  Section Close -->

    <!-- Notification PopupStart -->
    <div id="notificationOverlay" class="notification-overlay">
        <div class="notification-popup">
            <div id="notificationIcon" class="notification-icon"><i id="notificationIconClass"></i></div>
            <h3 id="notificationTitle" class="notification-title"></h3>
            <p id="notificationMessage" class="notification-message"></p>
            <div class="notification-actions">
                <button id="notificationClose" class="notification-btn secondary"><i class="fas fa-times"></i>
                    Close</button>
            </div>
        </div>
    </div>
    <!-- Notiificaation Popup  End -->

    <!-- Script -->

    <script src="assets/js/script.js"></script>
    <script src="assets/js/loadSections.js"></script>
    <script>
        // Active Link Logic
        function setActiveLink() {
            const links = Array.from(document.querySelectorAll('.nav-link'));
            const currentPath = window.location.pathname;
            links.forEach(link => link.classList.remove('active'));

            if (currentPath.includes('gallery')) {
                const galleryLink = links.find(link => link.getAttribute('href')?.includes('gallery'));
                if (galleryLink) galleryLink.classList.add('active');
            } else {
                const sections = ['home', 'about', 'skills', 'projects', 'experience', 'education', 'contact'];
                let current = '';
                sections.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        const rect = el.getBoundingClientRect();
                        if (rect.top <= 120 && rect.bottom >= 120) { current = '#' + id; }
                    }
                });
                links.forEach(a => {
                    if (a.getAttribute('href')?.endsWith(current)) a.classList.add('active');
                });
            }
        }
        if (!window.location.pathname.includes('gallery')) {
            window.addEventListener('scroll', setActiveLink);
        }
        document.addEventListener('DOMContentLoaded', setActiveLink);

        // Mobile Menu Logic
        document.addEventListener('DOMContentLoaded', () => {
            const navMenu = document.querySelector('.nav-menu');
            const hamburger = document.getElementById('hamburger');
            const navLinks = document.querySelectorAll('.nav-menu .nav-link');
            const closeMenu = () => {
                if (navMenu.classList.contains('active')) {
                    hamburger.classList.remove('active');
                    navMenu.classList.remove('active');
                }
            };
            navLinks.forEach(link => link.addEventListener('click', closeMenu));
        });
    </script>
    <!-- Script ENd -->

</body>

</html>
